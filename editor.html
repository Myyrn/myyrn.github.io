<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elental — Scenario Editor</title>
<style>
 :root{--bg:#f6f4ef;--fg:#222;--panel:#fff;--line:#d8d3c8;--accent:#8a3b12;--err:#b3261e;--warn:#9a6700;--ph:#fff4d6}
 @media (prefers-color-scheme:dark){:root{--bg:#1b1a18;--fg:#e8e4da;--panel:#26241f;--line:#3d3a33;--accent:#e0a36b;--err:#ff8a80;--warn:#f2c14e;--ph:#3b3320}}
 *{box-sizing:border-box} body{margin:0;font:13px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--fg)}
 header{display:flex;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
 nav{display:flex;gap:2px;padding:6px 10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap} nav button{border-radius:4px 4px 0 0;border-bottom:none}
 nav button.on{background:var(--panel);font-weight:600;color:var(--accent)}
 button,select,input{font:inherit;padding:3px 7px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg)} button{cursor:pointer} button:disabled{opacity:.4;cursor:default} button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
 main{padding:10px} .card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:10px} h3{margin:0 0 6px;font-size:13px;color:var(--accent)}
 table{border-collapse:collapse} td,th{padding:2px 4px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap} td input,td select{width:100%;min-width:60px} td.ph input{background:var(--ph)}
 .err{color:var(--err)} .warn{color:var(--warn)} .muted{opacity:.65} .row{display:flex;gap:6px;align-items:center;margin:4px 0;flex-wrap:wrap} .grid2{display:grid;grid-template-columns:minmax(300px,1fr) 340px;gap:10px} @media(max-width:900px){.grid2{grid-template-columns:1fr}}
 .scroll{overflow:auto;max-height:70vh} canvas{display:block;max-width:100%;cursor:crosshair;touch-action:none} li.issue{cursor:pointer;margin:2px 0}
</style></head>
<body>
<header><strong>Elental Editor</strong><span id="title" class="muted"></span>
 <button id="undo">Undo</button><button id="redo">Redo</button><button id="save">Save</button><button id="export">Export bundle</button>
 <label class="muted">Import <input id="import" type="file" accept=".json" style="width:150px"></label>
 <select id="open"></select><button id="openbtn">Open</button><button id="newbtn">New blank</button><button id="demobtn">Load demo</button>
 <span id="badge"></span><button id="launch" class="primary">Launch in game</button></header>
<nav id="tabs"></nav>
<main id="view">loading…</main>
<script type="module" src="src/editor/ui/editorShell.js"></script>
</body></html>
