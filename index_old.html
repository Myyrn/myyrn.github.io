<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Concordance — Alpha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">⟐</span>
        <div class="brand-text">
          <h1>Concordance</h1>
          <span class="brand-sub">a game of balance, not conquest — alpha</span>
        </div>
      </div>
      <nav class="tabs" id="tabs">
        <button class="tab active" data-tab="map">Map</button>
        <button class="tab" data-tab="empire">Empire</button>
        <button class="tab" data-tab="actions">Actions</button>
        <button class="tab" data-tab="world">Realms</button>
        <button class="tab" data-tab="diplomacy">Diplomacy</button>
        <button class="tab" data-tab="data">Data Editor</button>
        <button class="tab" data-tab="debug">Debug</button>
      </nav>
      <div class="tick-controls">
        <label class="dev-toggle"><input type="checkbox" id="devMode" /> Developer mode</label>
        <span class="tick-readout">Tick <b id="tickValue">0</b></span>
        <button class="btn-ghost" id="btnTick">Next tick ▸</button>
        <button class="btn-ghost" id="btnAuto">Auto-play ▸▸</button>
      </div>
    </header>

    <main class="layout">
      <section class="stage" id="pane-map">
        <div class="map-toolbar">
          <div class="mode-switch" id="mapModeSwitch">
            <button class="mode-btn active" data-mode="political">Political borders</button>
            <button class="mode-btn" data-mode="national">National borders</button>
            <button class="mode-btn" data-mode="economic">Economic development</button>
          </div>
          <div class="legend" id="mapLegend"></div>
        </div>
        <canvas id="mapCanvas" width="1000" height="800"></canvas>
      </section>

      <section class="stage pane-scroll hidden" id="pane-empire"></section>
      <section class="stage pane-scroll hidden" id="pane-actions"></section>
      <section class="stage pane-scroll hidden" id="pane-world"></section>
      <section class="stage pane-scroll hidden" id="pane-diplomacy"></section>
      <section class="stage pane-scroll hidden" id="pane-data"></section>
      <section class="stage pane-scroll hidden" id="pane-debug"></section>

      <aside class="inspector pane-scroll" id="inspector"></aside>
    </main>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
